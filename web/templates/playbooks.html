{% extends "base.html" %}

{% block title %}SAAOE • Playbooks{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header"><h2>Playbooks</h2></div>
  <section class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
    <div class="card">
      <div class="label">Create New Playbook</div>
      <div class="controls" style="flex-direction:column;">
        <label>Name <input id="pbName" class="btn" type="text" style="width:100%;" value="New Playbook" /></label>
        <label>Metric <select id="pbMetric" class="btn" style="width:100%;"><option value="cpu_percent">CPU %</option><option value="memory_percent">Memory %</option></select></label>
        <label>Operator <select id="pbOperator" class="btn" style="width:100%;"><option value=">">&gt;</option><option value=">=">&gt;=</option><option value="<">&lt;</option><option value="<=">&lt;=</option></select></label>
        <label>Threshold <input id="pbThreshold" class="btn" type="number" style="width:100%;" value="90" /></label>
        <label>Action <select id="pbAction" class="btn" style="width:100%;"><option value="kill_process">Kill process</option><option value="isolate_network">Isolate network segment</option><option value="block_ip">Block IP</option></select></label>
        <label>Target <input id="pbTarget" class="btn" type="text" style="width:100%;" value="*" /></label>
        <label><input id="pbAuto" type="checkbox" checked /> Auto-trigger</label>
        <button id="pbAddBtn" class="btn" style="margin-top:8px;">Add Playbook</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Playbook Runs</div>
      <div id="playbookRuns" style="max-height:330px; overflow:auto; background:rgba(0,0,0,0.1); padding:6px; border-radius:6px;"></div>
    </div>
  </section>

  <section class="grid" style="margin-top:12px;"><div class="card" style="grid-column: span 4;"><div class="label">Existing Playbooks</div><table class="table" id="playbooksTable"><thead><tr><th>Name</th><th>Condition</th><th>Action</th><th>Auto</th><th>Enabled</th><th>Ops</th></tr></thead><tbody></tbody></table></div></section>
</div>
{% endblock %}

{% block scripts %}
<script>
function refreshPlaybooks(){
  fetch('/api/playbooks').then(r=>r.json()).then(data=>{
    const body = document.querySelector('#playbooksTable tbody');
    body.innerHTML = '';
    data.playbooks.forEach(pb=>{
      const tr=document.createElement('tr');
      tr.innerHTML = `<td>${pb.name}</td><td>${pb.metric} ${pb.operator} ${pb.threshold}</td><td>${pb.action} (${pb.target})</td><td>${pb.auto}</td><td>${pb.enabled}</td><td><button class='btn btn-small' data-id='${pb.id}'>Delete</button></td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> {
        fetch('/api/playbooks', {method:'POST', headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:btn.dataset.id})})
          .then(_=>refreshPlaybooks());
      });
    });

    const runs = document.getElementById('playbookRuns');
    runs.innerHTML = '';
    (data.runs || []).slice(-8).reverse().forEach(r=>{
      const d=document.createElement('div');
      d.textContent = `${r.timestamp} ${r.name} -> ${r.action} (${r.status})`;
      runs.appendChild(d);
    });
  });
}

window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('pbAddBtn').addEventListener('click', ()=>{
    const payload={
      name: document.getElementById('pbName').value,
      metric: document.getElementById('pbMetric').value,
      operator: document.getElementById('pbOperator').value,
      threshold: Number(document.getElementById('pbThreshold').value),
      action_type: document.getElementById('pbAction').value,
      target: document.getElementById('pbTarget').value || 'all',
      enabled: true,
      auto: document.getElementById('pbAuto').checked
    };
    fetch('/api/playbooks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(_=>refreshPlaybooks());
  });
  refreshPlaybooks();
});
</script>
{% endblock %}
