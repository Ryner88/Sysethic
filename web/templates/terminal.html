{% extends "base.html" %}

{% block title %}SAAOE • Owner Console{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <div>
      <h2>Owner Console</h2>
      <div class="label">Audited constrained security diagnostics</div>
    </div>
    <div class="controls">
      <button id="clearBtn" class="btn">Clear</button>
    </div>
  </div>

  <section class="grid" style="grid-template-columns:2fr 1fr;">
    <div class="card terminal-card">
      <div class="terminal-output" id="terminalOutput"></div>
      <div class="terminal-input-row">
        <span class="prompt">$</span>
        <input id="commandInput" class="terminal-input" autocomplete="off" value="ps aux" />
        <button id="runBtn" class="btn">Run</button>
      </div>
    </div>
    <div class="card">
      <div class="label">Owner Commands</div>
      <div id="allowedCommands" class="pill-list"></div>
      <div class="help" id="terminalHelp">Platform-owner diagnostics are separate from workspace administration.</div>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
const out = document.getElementById('terminalOutput');

function print(text, cls='') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

async function runCommand() {
  const cmd = document.getElementById('commandInput').value.trim();
  if (!cmd) return;
  print(`$ ${cmd}\n`, 'terminal-command');
  const res = await fetch('/api/terminal/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({command:cmd})});
  const data = await res.json();
  if (data.error) print(`blocked: ${data.error}\n`, 'terminal-error');
  if (data.output) print(data.output);
  if (data.returncode !== undefined) print(`\nexit ${data.returncode}\n`, 'terminal-status');
}

fetch('/api/terminal/status').then(r=>r.json()).then(data => {
  document.getElementById('allowedCommands').innerHTML = data.allowed.map(c => `<span class="badge">${c}</span>`).join('');
  document.getElementById('terminalHelp').textContent = `Platform-owner commands run through a constrained API with shell execution disabled. Legacy WebSocket status: ${data.running ? 'running' : 'disabled'}.`;
});
document.getElementById('runBtn').onclick = runCommand;
document.getElementById('clearBtn').onclick = () => out.textContent = '';
document.getElementById('commandInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runCommand();
});
</script>
{% endblock %}
