{% extends "base.html" %}

{% block title %}SAAOE • Incidents{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <h2>Incidents</h2>
    <span class="label">Operational investigation workflow</span>
  </div>
  <section class="card">
    <div class="label">Incident Queue</div>
    <table class="table" id="incidentTable">
      <thead><tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Owner</th><th>Updated</th><th>Ops</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section class="card" style="margin-top:14px;">
    <div class="label">Selected Incident</div>
    <div id="incidentDetail" class="help">Select an incident.</div>
  </section>
</div>
<script>
const CAN_ANALYST = {{ 'true' if can('analyst') else 'false' }};
const Vocabulary = SysEthicVocabulary;
async function loadIncidents(){
  const data = await fetch('/api/incidents').then(r=>r.json());
  const body = document.querySelector('#incidentTable tbody');
  const incidents = data.incidents || [];
  body.innerHTML = incidents.length ? incidents.map(i => `
    <tr>
      <td>${i.id}</td><td>${i.title}</td><td>${Vocabulary.severityBadge(i.severity)}</td><td>${Vocabulary.statusBadge(i.status)}</td><td>${i.owner || ''}</td><td>${i.updated_at}</td>
      <td><button class="btn btn-small" onclick="openIncident('${i.id}')">Open</button></td>
    </tr>
  `).join('') : '<tr><td colspan="7" class="help">No incidents recorded yet.</td></tr>';
}
async function openIncident(id){
  const data = await fetch('/api/incidents/' + id).then(r=>r.json());
  const events = (data.timeline || []).map(e => `<div class="event-item"><strong>${e.event_type}</strong><span>${e.timestamp} · ${e.actor}</span><small>${e.detail}</small></div>`).join('');
  const controls = CAN_ANALYST ? `
    <div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-small" onclick="updateIncident('${id}', {status:'investigating'})">Investigating</button>
      <button class="btn btn-small" onclick="updateIncident('${id}', {status:'open'})">Reopen</button>
      <button class="btn btn-small" onclick="updateIncident('${id}', {status:'resolved', resolution:document.getElementById('incidentResolution').value})">Resolve</button>
      <button class="btn btn-small" onclick="updateIncident('${id}', {status:'dismissed', resolution:document.getElementById('incidentResolution').value})">Dismiss</button>
    </div>
    <div class="controls" style="flex-direction:column;align-items:stretch;margin:10px 0;">
      <input id="incidentOwner" class="btn" style="text-align:left;" placeholder="Owner" value="${data.incident.owner || ''}">
      <textarea id="incidentNote" class="btn" style="text-align:left;min-height:70px;" placeholder="Investigation note"></textarea>
      <textarea id="incidentResolution" class="btn" style="text-align:left;min-height:70px;" placeholder="Resolution summary">${data.incident.resolution || ''}</textarea>
      <div>
        <button class="btn btn-small" onclick="updateIncident('${id}', {owner:document.getElementById('incidentOwner').value})">Assign</button>
        <button class="btn btn-small" onclick="updateIncident('${id}', {note:document.getElementById('incidentNote').value})">Add Note</button>
      </div>
    </div>
  ` : '';
  document.getElementById('incidentDetail').innerHTML = `
    <div><strong>${data.incident.title}</strong> · ${Vocabulary.severityBadge(data.incident.severity)} ${Vocabulary.statusBadge(data.incident.status)}</div>
    ${controls}
    ${events || '<div class="label">No timeline events.</div>'}
  `;
}
async function updateIncident(id, changes){
  await fetch('/api/incidents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, ...changes})});
  await loadIncidents();
  await openIncident(id);
}
loadIncidents();
</script>
{% endblock %}
