{% extends "base.html" %}

{% block title %}SAAOE • Incidents{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <h2>Incidents</h2>
    <span class="label">Operational investigation workflow</span>
  </div>
  <section class="card">
    <div class="label">Incident Queue</div>
    <table class="table" id="incidentTable">
      <thead><tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Owner</th><th>Updated</th><th>Ops</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section class="card" style="margin-top:14px;">
    <div class="label">Selected Incident</div>
    <div id="incidentDetail" class="help">Select an incident.</div>
  </section>
</div>
<script>
async function loadIncidents(){
  const data = await fetch('/api/incidents').then(r=>r.json());
  const body = document.querySelector('#incidentTable tbody');
  body.innerHTML = (data.incidents || []).map(i => `
    <tr>
      <td>${i.id}</td><td>${i.title}</td><td>${i.severity}</td><td>${i.status}</td><td>${i.owner || ''}</td><td>${i.updated_at}</td>
      <td><button class="btn btn-small" onclick="openIncident('${i.id}')">Open</button></td>
    </tr>
  `).join('');
}
async function openIncident(id){
  const data = await fetch('/api/incidents/' + id).then(r=>r.json());
  const events = (data.timeline || []).map(e => `<div class="event-item"><strong>${e.event_type}</strong><span>${e.timestamp} · ${e.actor}</span><small>${e.detail}</small></div>`).join('');
  document.getElementById('incidentDetail').innerHTML = `
    <div><strong>${data.incident.title}</strong> · ${data.incident.status}</div>
    <div style="margin:10px 0;">
      <button class="btn btn-small" onclick="updateIncident('${id}','investigating')">Investigating</button>
      <button class="btn btn-small" onclick="updateIncident('${id}','resolved')">Resolve</button>
      <button class="btn btn-small" onclick="updateIncident('${id}','dismissed')">Dismiss</button>
    </div>
    ${events || '<div class="label">No timeline events.</div>'}
  `;
}
async function updateIncident(id, status){
  await fetch('/api/incidents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, status})});
  await loadIncidents();
  await openIncident(id);
}
loadIncidents();
</script>
{% endblock %}
