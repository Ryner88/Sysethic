{% extends "base.html" %}

{% block title %}SysEthic • Security{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <h1 style="font-size:2.2rem;font-family:var(--font-mono);margin-bottom:0;">Security Center</h1>
    <div style="color:var(--muted);font-size:1.1rem;margin-bottom:18px;">Threat detection, access control &amp; security enforcement</div>
  </div>

  <div class="stat-grid" style="margin-bottom:18px;">
    <div class="stat-card">
      <div class="stat-label">OPEN ALERTS</div>
      <div class="stat-value" id="openAlerts">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CRITICAL</div>
      <div class="stat-value alert-critical" id="criticalAlerts">--</div>
      <div class="alert-trend" id="criticalTrend"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">RESOLVED</div>
      <div class="stat-value" id="resolvedAlerts">--</div>
    </div>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:18px;">
    <select id="severityFilter" class="btn" style="min-width:140px;">
      <option value="">All Severity</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
      <option value="info">Info</option>
    </select>
    <select id="statusFilter" class="btn" style="min-width:140px;">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="investigating">Investigating</option>
      <option value="waiting_for_approval">Waiting for Approval</option>
      <option value="resolved">Resolved</option>
      <option value="dismissed">Dismissed</option>
      <option value="failed">Failed</option>
    </select>
  </div>

  <div class="alert-list" id="alertList"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const Vocabulary = SysEthicVocabulary;

function renderAlert(alert) {
  return `
    <div class="alert-item" style="margin-bottom:18px;background:rgba(255,255,255,0.01);">
      ${Vocabulary.severityBadge(alert.severity)}
      ${Vocabulary.statusBadge(alert.status)}
      <span style="font-size:12px;color:var(--muted);margin-right:8px;">anomaly detected</span>
      <div style="font-weight:700;font-size:1.1rem;margin-bottom:2px;">${alert.title||alert.event||'Security Event'}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:2px;">
        Source: ${alert.source||'local telemetry'} &nbsp; Process/Indicator: ${alert.process||'--'} &nbsp; <span style="font-size:12px;">&#9679; Confidence: ${alert.confidence||'--'}%</span> &nbsp; ${alert.time||''}
      </div>
      <div style="font-size:13px;color:var(--good);margin-bottom:2px;">&#128272; Recommended: ${alert.recommendation||'--'}</div>
      ${Vocabulary.normalizeStatus(alert.status)==='open'?'<button class="btn" style="float:right;margin-top:4px;" onclick="markResolved(this)">Mark Resolved</button>':''}
    </div>
  `;
}

async function loadSecurityAlerts() {
  const res = await fetch('/api/security/alerts');
  const data = await res.json();
  let alerts = data.alerts || [];

  // Filters
  const sev = document.getElementById('severityFilter').value;
  const stat = document.getElementById('statusFilter').value;
  let filtered = alerts.filter(a => (!sev||Vocabulary.normalizeSeverity(a.severity)===sev) && (!stat||Vocabulary.normalizeStatus(a.status)===stat));

  // Stat cards
  document.getElementById('openAlerts').textContent = alerts.filter(a=>Vocabulary.normalizeStatus(a.status)==='open').length;
  document.getElementById('criticalAlerts').textContent = alerts.filter(a=>Vocabulary.normalizeSeverity(a.severity)==='critical').length;
  document.getElementById('resolvedAlerts').textContent = alerts.filter(a=>Vocabulary.normalizeStatus(a.status)==='resolved').length;
  document.getElementById('criticalTrend').textContent = alerts.length ? 'from telemetry anomalies' : '';

  // Alert list
  document.getElementById('alertList').innerHTML = filtered.length ? filtered.map(renderAlert).join('') : '<div class="label">No security alerts from current telemetry.</div>';
}

function markResolved(btn) {
  const badge = btn.closest('.alert-item').querySelector('.vocabulary-badge[class*="status-"]');
  badge.outerHTML = Vocabulary.statusBadge('resolved');
  btn.remove();
  // Optionally: send POST to backend to update status
}

document.getElementById('severityFilter').addEventListener('change', loadSecurityAlerts);
document.getElementById('statusFilter').addEventListener('change', loadSecurityAlerts);
loadSecurityAlerts();
setInterval(loadSecurityAlerts, 15000);
</script>
{% endblock %}
