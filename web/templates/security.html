{% extends "base.html" %}

{% block title %}SAAOE • Security{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <h1 style="font-size:2.2rem;font-family:var(--font-mono);margin-bottom:0;">Security Center</h1>
    <div style="color:var(--muted);font-size:1.1rem;margin-bottom:18px;">Threat detection, access control &amp; security enforcement</div>
  </div>

  <div class="stat-grid" style="margin-bottom:18px;">
    <div class="stat-card">
      <div class="stat-label">OPEN ALERTS</div>
      <div class="stat-value" id="openAlerts">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CRITICAL</div>
      <div class="stat-value alert-critical" id="criticalAlerts">--</div>
      <div class="alert-trend" id="criticalTrend"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">RESOLVED</div>
      <div class="stat-value" id="resolvedAlerts">--</div>
    </div>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:18px;">
    <select id="severityFilter" class="btn" style="min-width:140px;">
      <option value="">All Severity</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <select id="statusFilter" class="btn" style="min-width:140px;">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="investigating">Investigating</option>
      <option value="resolved">Resolved</option>
    </select>
  </div>

  <div class="alert-list" id="alertList"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Badge color helpers
function badgeClass(sev) {
  sev = (sev||'').toLowerCase();
  if (sev==='critical') return 'alert-badge critical';
  if (sev==='high') return 'alert-badge high';
  if (sev==='medium') return 'alert-badge medium';
  if (sev==='low') return 'alert-badge low';
  return 'alert-badge';
}
function statusClass(status) {
  status = (status||'').toLowerCase();
  if (status==='open') return 'alert-status open';
  if (status==='investigating') return 'alert-status investigating';
  if (status==='resolved') return 'alert-status resolved';
  return 'alert-status';
}

function renderAlert(alert) {
  return `
    <div class="alert-item" style="border:2px solid ${alert.severity==='critical'?'#ff4444':'#222'};margin-bottom:18px;box-shadow:0 2px 12px rgba(255,68,68,0.07);background:rgba(255,255,255,0.01);">
      <span class="${badgeClass(alert.severity)}">${alert.severity}</span>
      <span class="${statusClass(alert.status)}">${alert.status}</span>
      <span style="font-size:12px;color:var(--muted);margin-right:8px;">anomaly detected</span>
      <div style="font-weight:700;font-size:1.1rem;margin-bottom:2px;">${alert.title||alert.event||'Security Event'}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:2px;">
        User: ${alert.user||'--'} &nbsp; Process: ${alert.process||'--'} &nbsp; <span style="font-size:12px;">&#9679; AI Confidence: ${alert.confidence||'--'}%</span> &nbsp; ${alert.time||''}
      </div>
      <div style="font-size:13px;color:var(--good);margin-bottom:2px;">&#128272; Recommended: ${alert.recommendation||'--'}</div>
      ${alert.status==='open'?'<button class="btn" style="float:right;margin-top:4px;" onclick="markResolved(this)">Mark Resolved</button>':''}
    </div>
  `;
}

async function loadSecurityAlerts() {
  const res = await fetch('/api/security/alerts');
  const data = await res.json();
  let alerts = data.alerts || [];

  // Demo: add more fields for UI
  alerts = alerts.map((a,i) => ({
    ...a,
    status: i===0?'resolved':(i===1?'investigating':'open'),
    title: a.event==='Unauthorized access'?'Unusual CPU spike detected on guest process curl-download (PID 5200)':(a.event==='Firewall triggered'?'Unknown binary attempted to access /etc/shadow with elevated privileges':'Security Event'),
    user: i===0?'guest_01':'guest_02',
    process: i===0?'curl-download':'unknown-binary',
    confidence: i===0?87:95,
    time: i===0?'Mar 19, 22:09':'Mar 19, 22:09',
    recommendation: i===0?'Suspend process and audit network connections':'Terminate process immediately and lock user account'
  }));

  // Filters
  const sev = document.getElementById('severityFilter').value;
  const stat = document.getElementById('statusFilter').value;
  let filtered = alerts.filter(a => (!sev||a.severity.toLowerCase()===sev) && (!stat||a.status.toLowerCase()===stat));

  // Stat cards
  document.getElementById('openAlerts').textContent = alerts.filter(a=>a.status==='open').length;
  document.getElementById('criticalAlerts').textContent = alerts.filter(a=>a.severity==='critical').length;
  document.getElementById('resolvedAlerts').textContent = alerts.filter(a=>a.status==='resolved').length;
  document.getElementById('criticalTrend').textContent = '+15% from last hour';

  // Alert list
  document.getElementById('alertList').innerHTML = filtered.map(renderAlert).join('');
}

function markResolved(btn) {
  btn.closest('.alert-item').querySelector('.alert-status').textContent = 'resolved';
  btn.closest('.alert-item').querySelector('.alert-status').className = 'alert-status resolved';
  btn.remove();
  // Optionally: send POST to backend to update status
}

document.getElementById('severityFilter').addEventListener('change', loadSecurityAlerts);
document.getElementById('statusFilter').addEventListener('change', loadSecurityAlerts);
loadSecurityAlerts();
setInterval(loadSecurityAlerts, 15000);
</script>
{% endblock %}
