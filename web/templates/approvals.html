{% extends "base.html" %}

{% block title %}SAAOE • Approvals{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <h2>Response Approvals</h2>
    <span class="label">Human-gated host actions</span>
  </div>
  <section class="grid">
    <div class="card">
      <div class="label">Request Action</div>
      <label>Action
        <select id="action" class="btn" style="width:100%;margin-top:6px;">
          <option value="kill_process">Kill process</option>
          <option value="quarantine_file">Quarantine file</option>
          <option value="block_ip">Block IP</option>
          <option value="restart_service">Restart approved service</option>
          <option value="create_incident_report">Create incident report</option>
        </select>
      </label>
      <label>Target <input id="target" class="btn" style="width:100%;margin-top:6px;text-align:left;" placeholder="PID, file path, IP, or saaoe-dashboard"></label>
      <label>Incident ID <input id="incidentId" class="btn" style="width:100%;margin-top:6px;text-align:left;"></label>
      <label><input id="dryRun" type="checkbox" checked> Dry run</label>
      <label>Decision Reason <input id="decisionReason" class="btn" style="width:100%;margin-top:6px;text-align:left;" placeholder="Required for approve, reject, or cancel"></label>
      <button id="requestApproval" class="btn" style="margin-top:10px;">Request Approval</button>
      <div id="approvalMessage" class="help" style="margin-top:10px;"></div>
    </div>
    <div class="card" style="grid-column: span 3;">
      <div class="label">Approval Queue</div>
      <table class="table" id="approvalTable">
        <thead><tr><th>ID</th><th>Action</th><th>Target</th><th>Status</th><th>Requested By</th><th>Ops</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>
<script>
const CAN_ADMIN = {{ 'true' if can('admin') else 'false' }};
function approvalDisplayStatus(approval){
  const status = approval.status || 'pending';
  return status === 'pending' ? (approval.workflow_status || status) : status;
}
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function renderApprovalRow(a){
  const status = a.status || 'pending';
  const displayStatus = approvalDisplayStatus(a);
  const terminal = status !== 'pending';
  const statusBadge = terminal
    ? `<span class="vocabulary-badge status-${escapeHtml(status).replaceAll('_', '-')}">${escapeHtml(a.status_label || status)}</span>`
    : SysEthicVocabulary.statusBadge(displayStatus);
  return `
    <tr id="approval-row-${escapeHtml(a.id)}" data-approval-id="${escapeHtml(a.id)}">
      <td>${escapeHtml(a.id)}</td><td>${escapeHtml(a.action)}</td><td>${escapeHtml(a.target)}</td><td>${statusBadge}</td><td>${escapeHtml(a.requested_by)}</td>
      <td>
        ${CAN_ADMIN ? `<button class="btn btn-small approval-action" data-command="approve" data-id="${escapeHtml(a.id)}" ${terminal ? 'disabled' : ''}>Approve</button>
        <button class="btn btn-small approval-action" data-command="reject" data-id="${escapeHtml(a.id)}" ${terminal ? 'disabled' : ''}>Reject</button>
        <button class="btn btn-small approval-action" data-command="cancel" data-id="${escapeHtml(a.id)}" ${terminal ? 'disabled' : ''}>Cancel</button>
        <button class="btn btn-small approval-action" data-command="execute" data-id="${escapeHtml(a.id)}" ${status === 'approved' ? '' : 'disabled'}>Execute</button>` : ''}
        <div class="help row-message" id="approval-message-${escapeHtml(a.id)}"></div>
      </td>
    </tr>
  `;
}
function setMessage(text, isError=false, id=null){
  const global = document.getElementById('approvalMessage');
  global.textContent = text || '';
  global.style.color = isError ? 'var(--bad)' : '';
  if(id){
    const rowMessage = document.getElementById('approval-message-' + id);
    if(rowMessage){
      rowMessage.textContent = text || '';
      rowMessage.style.color = isError ? 'var(--bad)' : '';
    }
  }
}
function replaceApprovalRow(approval){
  const row = document.getElementById('approval-row-' + approval.id);
  if(row){
    row.outerHTML = renderApprovalRow(approval);
  } else {
    loadApprovals();
  }
}
async function loadApprovals(){
  const data = await fetch('/api/response_approvals').then(r=>r.json());
  const approvals = data.approvals || [];
  document.querySelector('#approvalTable tbody').innerHTML = approvals.length
    ? approvals.map(renderApprovalRow).join('')
    : '<tr><td colspan="6" class="help">No approval requests yet.</td></tr>';
}
async function approvalCommand(id, command){
  const reason = decisionReason.value.trim();
  if(command !== 'execute' && !reason){
    setMessage('Decision reason is required.', true, id);
    decisionReason.focus();
    return;
  }
  const body = {command};
  if(command !== 'execute') body.reason = reason;
  const res = await fetch('/api/response_approvals/' + id, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if(data.approval) replaceApprovalRow(data.approval);
  setMessage(data.error || data.result?.detail || command + ' complete', !res.ok, id);
  if(res.ok && command !== 'execute') decisionReason.value = '';
}
document.getElementById('requestApproval').addEventListener('click', async () => {
  if(!target.value.trim()){
    setMessage('Target is required.', true);
    target.focus();
    return;
  }
  const payload = {action: action.value, target: target.value.trim(), incident_id: incidentId.value || null, dry_run: dryRun.checked};
  const res = await fetch('/api/response_approvals', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  const data = await res.json();
  setMessage(data.error || data.preview || 'Approval requested.', !res.ok);
  loadApprovals();
});
document.querySelector('#approvalTable tbody').addEventListener('click', event => {
  const button = event.target.closest('.approval-action');
  if(button) approvalCommand(button.dataset.id, button.dataset.command);
});
loadApprovals();
</script>
{% endblock %}
