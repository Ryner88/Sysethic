{% extends "base.html" %}

{% block title %}SAAOE • Automation{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header"><h2>Automation Rules</h2></div>
  <section class="grid" style="grid-template-columns:1fr 1fr;">
    <div class="card">
      <div class="label">Create Conditional Trigger</div>
      <div class="controls" style="flex-direction:column;align-items:stretch;">
        <label>Name <input id="ruleName" class="btn" value="Critical process isolation"></label>
        <label>Field <select id="ruleField" class="btn"><option value="severity">Severity</option><option value="risk_score">Risk Score</option><option value="metric">Metric</option></select></label>
        <label>Operator <select id="ruleOperator" class="btn"><option value="equals">equals</option><option value=">=">&gt;=</option><option value=">">&gt;</option><option value="<=">&lt;=</option><option value="<">&lt;</option></select></label>
        <label>Value <input id="ruleValue" class="btn" value="critical"></label>
        <label>Run Action <select id="ruleAction" class="btn"><option>Isolate Process</option><option>Block IP</option><option>Capture Forensics Bundle</option><option>Notify Analyst</option></select></label>
        <button id="addRule" class="btn">Add Rule</button>
      </div>
    </div>
    <div class="card">
      <div class="label">Automated Action History</div>
      <div id="automationHistory" class="event-list"></div>
    </div>
  </section>
  <section class="card" style="margin-top:14px;">
    <div class="label">Active Rules</div>
    <table class="table" id="automationTable"><thead><tr><th>Name</th><th>Condition</th><th>Action</th><th>Enabled</th><th>Ops</th></tr></thead><tbody></tbody></table>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>
function refreshAutomation(){
  fetch('/api/automation_rules').then(r=>r.json()).then(data => {
    document.querySelector('#automationTable tbody').innerHTML = data.rules.map(r => `
      <tr><td>${r.name}</td><td>${r.field} ${r.operator} ${r.value}</td><td>${r.action}</td><td>${r.enabled}</td>
      <td><button class="btn btn-small" onclick="deleteRule(${r.id})">Delete</button></td></tr>`).join('');
    document.getElementById('automationHistory').innerHTML = (data.history || []).slice().reverse().map(h => `
      <div class="event-item"><strong>${h.action}</strong><span>${new Date(h.timestamp).toLocaleString()} · ${h.rule_name} · ${h.status}</span><small>${h.details}</small></div>`).join('') || '<div class="label">No automated actions yet.</div>';
  });
}
function deleteRule(id){
  fetch('/api/automation_rules', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'delete', id})}).then(refreshAutomation);
}
document.getElementById('addRule').onclick = () => {
  fetch('/api/automation_rules', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
    name: document.getElementById('ruleName').value,
    field: document.getElementById('ruleField').value,
    operator: document.getElementById('ruleOperator').value,
    value: document.getElementById('ruleValue').value,
    run_action: document.getElementById('ruleAction').value,
    enabled: true
  })}).then(refreshAutomation);
};
refreshAutomation();
setInterval(refreshAutomation, 10000);
</script>
{% endblock %}
