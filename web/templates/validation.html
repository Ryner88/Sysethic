{% extends "base.html" %}

{% block title %}SAAOE • Validation{% endblock %}

{% block content %}
<div class="wrap">
  <div class="page-header">
    <h2>Operational Validation</h2>
    <span class="label">Safe end-to-end workflow checks</span>
  </div>
  <section class="card">
    <div class="label">Create Controlled Validation Event</div>
    <div id="validationButtons"></div>
    <div id="validationMessage" class="help" style="margin-top:12px;"></div>
  </section>
  <section class="card" style="margin-top:14px;">
    <div class="label">Validation History</div>
    <table class="table" id="validationTable">
      <thead><tr><th>ID</th><th>Type</th><th>Status</th><th>Anomaly</th><th>Incident</th><th>Detail</th><th>Created</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</div>
<script>
async function loadValidation(){
  const data = await fetch('/api/validation_events').then(r=>r.json());
  const types = data.event_types || {};
  document.getElementById('validationButtons').innerHTML = Object.entries(types).map(([key, cfg]) =>
    `<button class="btn" onclick="runValidation('${key}')" title="${cfg.detail || ''}">${cfg.label || key}</button>`
  ).join('');
  document.querySelector('#validationTable tbody').innerHTML = (data.events || []).map(e => `
    <tr><td>${e.id}</td><td>${types[e.event_type]?.label || e.event_type}</td><td>${SysEthicVocabulary.statusBadge(e.status)}</td><td>${e.anomaly_id || ''}</td><td>${e.incident_id || ''}</td><td>${e.detail || ''}</td><td>${e.created_at}</td></tr>
  `).join('');
}
async function runValidation(event_type){
  const res = await fetch('/api/validation_events', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({event_type})});
  const data = await res.json();
  const playbooks = (data.playbook_runs || []).map(run => run.name).join(', ');
  document.getElementById('validationMessage').textContent = data.error || `Created controlled validation event ${data.event_id}, incident ${data.incident.id}${playbooks ? `, and playbook run ${playbooks}` : ''}`;
  loadValidation();
}
loadValidation();
</script>
{% endblock %}
